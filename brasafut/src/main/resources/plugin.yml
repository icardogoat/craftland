name: BrasaFut
version: 0.2.0
main: br.com.brasafut.BrasaFutPlugin
api-version: '1.20'
author: icardogoat
description: Futebol completo com clubes, arenas e bola própria em um único plugin.
commands:
  fut:
    description: Comando principal do BrasaFut
    usage: /fut
    aliases: [brasafut, futebol]
permissions:
  brasafut.use:
    default: true
  brasafut.admin:
    default: op
