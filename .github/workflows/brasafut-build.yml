name: BrasaFut Build

on:
  push:
    branches: [brasafut]
    paths:
      - 'brasafut/**'
      - '.github/workflows/brasafut-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        working-directory: brasafut
        run: mvn -B clean package

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BrasaFut-jar
          path: brasafut/target/BrasaFut-*.jar
          if-no-files-found: error
